[package]
name = "ultravox"
version = "0.11.0"
description = "UltraVox — real-time audio transcription with on-device models"
authors = ["Implose Cybernetics"]
license = "MIT"
repository = "https://github.com/michael-berardi/ultravox"
edition = "2021"
rust-version = "1.80"
default-run = "ultravox"

[lib]
name = "ultravox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ultravox-control"
path = "src/bin/ultravox-control.rs"
required-features = ["cli"]

[[bin]]
name = "ultravox"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
arboard = "3"
ultravox-core = { path = "../../../crates/ultravox-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "fs", "process", "sync"] }
libc = "0.2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Implose distribution: revocable device licenses and signed requests.
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }

[target.'cfg(target_os = "macos")'.dependencies]
ultravox-macos-bridge = { path = "../../../crates/ultravox-macos-bridge" }
ultra-media-remote = { git = "https://github.com/michael-berardi/ultra-media-remote", rev = "a3bd35d83a9c117616840dd74efbff754c276753" }
window-vibrancy = "0.6"
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }
hound = "3.5"
whisper-rs = "0.16"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
hound = "3.5"
whisper-rs = "0.16"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
cli = []
mirror-debug = []
custom-protocol = ["tauri/custom-protocol"]
