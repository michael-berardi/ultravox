[package]
name = "dictator"
version = "0.1.0"
description = "Dictator — real-time audio transcription with on-device models"
authors = ["Implose Labs"]
license = "MIT"
repository = "https://github.com/michael-berardi/dictator"
edition = "2021"
rust-version = "1.77"
default-run = "dictator"

[lib]
name = "dictator_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dictator-control"
path = "src/bin/dictator-control.rs"
required-features = ["cli"]

[[bin]]
name = "dictator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
arboard = "3"
dictator-core = { path = "../../../crates/dictator-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "fs", "process"] }
libc = "0.2"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
dictator-macos-bridge = { path = "../../../crates/dictator-macos-bridge" }
window-vibrancy = "0.6"

[features]
default = ["custom-protocol"]
cli = []
custom-protocol = ["tauri/custom-protocol"]
