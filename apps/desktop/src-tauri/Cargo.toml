[package]
name = "ultravox"
version = "0.1.0"
description = "UltraVox — real-time audio transcription with on-device models"
authors = ["Implose Labs"]
license = "MIT"
repository = "https://github.com/michael-berardi/ultravox"
edition = "2021"
rust-version = "1.77"
default-run = "ultravox"

[lib]
name = "ultravox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ultravox-control"
path = "src/bin/ultravox-control.rs"
required-features = ["cli"]

[[bin]]
name = "ultravox"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
arboard = "3"
ultravox-core = { path = "../../../crates/ultravox-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "fs", "process"] }
libc = "0.2"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
ultravox-macos-bridge = { path = "../../../crates/ultravox-macos-bridge" }
window-vibrancy = "0.6"

[features]
default = ["custom-protocol"]
cli = []
custom-protocol = ["tauri/custom-protocol"]
