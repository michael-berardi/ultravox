[package]
name = "ultravox-core"
version = "0.1.0"
edition = "2021"
authors = ["Implose Labs"]
license = "MIT"
description = "Core Rust library for UltraVox (audio, transcription, config, history, model catalog)"
repository = "https://github.com/michael-berardi/ultravox"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["uuid", "chrono", "bundled"] }
toml = "0.8"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "fs", "io-util"] }
cpal = "0.15"
hound = "3.5"
reqwest = { version = "0.12", features = ["stream"] }

[lib]
crate-type = ["rlib"]